services:
  zhuiju-finder:
    build: .
    image: zhuiju-finder:latest
    container_name: zhuiju-finder
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 数据源与更新周期（一般不改）
      DATA_SOURCE_URL: "https://raw.githubusercontent.com/laoma528/awesome-zhuiju-free/main/resources/resources.json"
      UPDATE_INTERVAL_HOURS: "24"
      UPDATE_ON_START: "1"
      TZ: "Asia/Shanghai"
    volumes:
      # 持久化缓存：更新后的 resources.json 与自定义搜索模板
      # 注意：首次启动若宿主 ./data 为空，会覆盖镜像内置兜底数据；
      # 但服务会自动从 GitHub 重新拉取，不影响使用。
      - ./data:/app/data
    # 健康检查：用镜像内置的 python 探测 /healthz（slim 镜像无 curl）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"]
      interval: 30s      # 每 30 秒检查一次
      timeout: 10s       # 单次检查超时
      retries: 3         # 连续 3 次失败标记为 unhealthy
      start_period: 40s  # 启动宽限期，避免初始化时被误判
    # 日志轮转：防止日志文件无限增长撑爆磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 资源限制：防止异常时占用过多资源（按需调整）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
