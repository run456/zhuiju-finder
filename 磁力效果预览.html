      +   '<span class="ty '+cls+'">'+esc(x.type_label)+'</span>'
      +   (x.version?'<span class="ver">'+esc(x.version)+'</span>':'')
      +   '<span class="size">'+fmtSize(x.size)+'</span>'
      +   '<span class="fname">'+(i+1)+'. '+esc(x.filename)+'</span>'
      + '</div>'
      + '<div class="link-row">'
      +   '<div class="link-box '+(isMag?'mag':'')+'" title="'+esc(x.url)+'">'+esc(x.url)+'</div>'
      +   '<button class="mini copy" onclick="copyText('+i+',this)">复制</button>'
      +   '<button class="mini open" onclick="openLink('+i+')">打开</button>'
      + '</div>'
      + '</div>';
  }).join('');
  window._rows=rows;
}

function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(window._tt); window._tt=setTimeout(()=>el.classList.remove('show'),1800);
}
function doCopy(text){
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板')).catch(()=>fallback(text)); }
  else fallback(text);
}
function fallback(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制到剪贴板'); }catch(e){ toast('复制失败，请手动选中'); }
  document.body.removeChild(ta);
}
function copyText(i,btn){ doCopy(window._rows[i].url); }
function copyAll(){
  const links=window._rows.map(x=>x.url).filter(Boolean);
  doCopy(links.join('\n'));
  toast('已复制 '+links.length+' 条链接');
}
function openLink(i){
  const u=window._rows[i].url;
  if(u.startsWith('magnet:')){ toast('磁力链需粘贴到下载工具，已为你复制'); doCopy(u); }
  else window.open(u,'_blank');
}
render();
</script>
</body>
</html>
